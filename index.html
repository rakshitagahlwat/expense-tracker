<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">
      <h1 class="title">Expense Tracker</h1>

      <p class="subtitle">
        Track your money smartly with beautiful analytics and smooth animations.
      </p>

      <div class="balance-box">
        <p class="balance-label">Current Balance</p>
        <h2 class="balance" id="balance">₹0</h2>
      </div>

      <div class="summary">

        <div class="summary-card income-card">
          <p class="summary-title">Total Income</p>
          <h3 class="summary-amount" id="income">+ ₹0</h3>
        </div>

        <div class="summary-card expense-card">
          <p class="summary-title">Total Expense</p>
          <h3 class="summary-amount" id="expense">- ₹0</h3>
        </div>

      </div>

      <form id="expenseForm">

        <div class="input-group">
          <label>Transaction Name</label>
          <input
            type="text"
            id="text"
            placeholder="e.g. Salary, Shopping, Food"
            required
          >
        </div>

        <div class="input-group">
          <label>Amount</label>
          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            required
          >
        </div>

        <div class="input-group">
          <label>Type</label>

          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <button class="btn" type="submit">
          Add Transaction
        </button>

      </form>
    </div>

    <div class="card right-card">

      <div class="history-header">
        <h2 class="history-title">Transaction History</h2>

        <button class="clear-btn" id="clearAll">
          Clear All
        </button>
      </div>

      <div class="transaction-list" id="transactionList">

        <div class="empty">
          <h3>No Transactions Yet</h3>
          <p>Add your first income or expense.</p>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
